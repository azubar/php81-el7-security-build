name: Inspect failed regression tests
on:
  push:
    paths: ['.github/workflows/inspect-failure.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read synthetic test diagnostics from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir diagnostics
          gh release download experiment-39678029179-1 --dir diagnostics --pattern test-failures.txt --pattern test-output-paths.txt --pattern rpmbuild.log
          cat diagnostics/test-output-paths.txt
          cat diagnostics/test-failures.txt
          grep -E 'Tests failed|Tests passed|Tests skipped|Number of tests|FAILED TEST SUMMARY|^FAILED|^FAIL ' diagnostics/rpmbuild.log | tail -120
